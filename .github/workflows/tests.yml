#
# Tests against the public cap.v0 message definitions, generated from cap-spec on every run, with the Python SDK
# from cap-reference.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Check out cap-spec (message definitions)
        uses: actions/checkout@v7
        with:
          repository: cooperative-agent-protocol/cap-spec
          path: _cap-spec

      - name: Check out cap-reference (the Python SDK)
        uses: actions/checkout@v7
        with:
          repository: cooperative-agent-protocol/cap-reference
          path: _cap-reference

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the protobuf compiler and the test dependencies
        run: python -m pip install grpcio-tools pytest pytest-asyncio numpy pydantic pyyaml cryptography "protobuf>=7.35"

      - name: Generate the cap.v0 Python bindings
        run: |
          mkdir -p _gen
          python -m grpc_tools.protoc -I _cap-spec/proto --python_out=_gen --grpc_python_out=_gen \
            $(find _cap-spec/proto -name '*.proto')

      - name: Run the tests
        env:
          PYTHONPATH: ".:_gen:_cap-reference/python"
        run: python -m pytest tests -q
